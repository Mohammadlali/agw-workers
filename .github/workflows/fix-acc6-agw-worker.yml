name: One-off - restore ACC6's agw-worker.yml after the blind fleet propagation

# control-room's propagate-agw-worker-fix.yml overwrote
# mohammadlali0707-stack/agw-workers' .github/workflows/agw-worker.yml
# wholesale with THIS repo's own copy (commits 96b03d7, e568ac5 there,
# "Control Room Bot" identity). That destroyed ACC6's own, independently
# evolved local customizations -- self-identity-first token selection with
# quota fallback, ACC9 retirement, the "post output as an issue comment"
# step the @agy -> @claude handoff depends on, the ##MEDIA_REQUEST## relay,
# and ACC6's own target_repo entries
# (mohammadlali0707-stack/Control-Room, .../Claud-Cloud-Project) -- because
# this repo's own agw-worker.yml serves a different purpose (central
# Control-Room-driven cross-account dispatch) than each account's own local
# copy (same-repo self-dispatch), so the two were never meant to be
# byte-identical in the first place.
#
# fleet-fixes/acc6-agw-worker.yml (this repo) is the reconciled version:
# ACC6's last good local commit (045f7e6) as the base, plus the one real
# improvement the propagation actually had (an unlimited-size
# Reports/agy/<tag>.txt audit trail, kept ALONGSIDE the issue comment, not
# instead of it), plus removing a console/summary output leak that even
# ACC6's own pre-overwrite version still had (a `head -20`/`head -50` of
# agy's raw output).
#
# This repo already holds ACC6_PAT (used elsewhere for other ACC6 checkouts
# in this same file) with write access to mohammadlali0707-stack's repos --
# same jump-server pattern as every other cross-account write in this
# fleet, since a GitHub secret cannot be attached to a session on a
# different owner directly.
#
# One-off: delete this workflow (and fleet-fixes/) once it has run
# successfully.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate the reconciled file before pushing it anywhere
        run: python3 -c "import yaml; yaml.safe_load(open('fleet-fixes/acc6-agw-worker.yml'))"

      - name: Push the reconciled agw-worker.yml to mohammadlali0707-stack/agw-workers
        env:
          ACC6_PAT: ${{ secrets.ACC6_PAT }}
        run: |
          set -e
          if [ -z "$ACC6_PAT" ]; then
            echo "::error::secrets.ACC6_PAT is not set on this repo"
            exit 1
          fi
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ACC6_PAT" | base64 -w0)"
          git -c http.https://github.com/.extraHeader="$AUTH_HEADER" clone \
            https://github.com/mohammadlali0707-stack/agw-workers.git /tmp/acc6-repo
          cp fleet-fixes/acc6-agw-worker.yml /tmp/acc6-repo/.github/workflows/agw-worker.yml
          cd /tmp/acc6-repo
          git config user.email "agy-bot@claud-cloud.local"
          git config user.name "AGY Bot"
          git add .github/workflows/agw-worker.yml
          if git diff --cached --quiet; then
            echo "Already up to date -- nothing to push."
            exit 0
          fi
          git commit -m "agw-worker: restore self-identity+fallback, ACC9 retirement, @claude handoff comment, media relay and this account's own target_repo entries lost in the blind fleet-wide propagation from Mohammadlali/agw-workers@96b03d7/e568ac5, while keeping that propagation's one real improvement (a size-unlimited Reports/agy/ audit trail) and closing a console/summary output leak both versions still had"
          n=0
          until git -c http.https://github.com/.extraHeader="$AUTH_HEADER" push origin "HEAD:$(git symbolic-ref --short HEAD)"; do
            n=$((n+1))
            if [ "$n" -ge 4 ]; then echo "::error::push failed"; exit 1; fi
            sleep $((2 ** n))
            git -c http.https://github.com/.extraHeader="$AUTH_HEADER" fetch origin
            git rebase "origin/$(git symbolic-ref --short HEAD)"
          done
          echo "Pushed."
