name: AGW Worker AGY Issue Bot (same-repo, no relay)

# Same-repo replacement for Claud-Cloud-Project's agy-issue-bot.yml relay.
# That relay always ran its own orchestration+poll job on 1997's Actions
# for every dispatched issue, regardless of which account actually did the
# work -- confirmed 2026-09-09 by reading its dispatch table directly. This
# listener removes that: an @agy issue opened HERE dispatches
# agw-worker.yml IN THIS SAME REPO, using this repo's own default
# GITHUB_TOKEN -- no cross-account call, no ~20-minute poll, no relay.
#
# target_repo/target_branch below are set to THIS account's own wired key
# repo (Team/ACCOUNTS.md), using the same PAT agw-worker.yml already uses
# for it -- never a different account's credential.
#
# FIXED 2026-09-14 (three bugs, patched from mohammadlali0707-stack via a
# cross-account dispatch -- this session has no direct write access to
# this repo): status2.airboxvip.top's dashboard chat creates issues here
# via AGY_CHAT_ACC0_PAT, appending "@agy" at the END of the typed message
# (see status-dashboard's api/agy_create.js). None were ever processed:
# 1. This file's `if:` used `startsWith(body, '@agy')` -- the opposite
#    end from where the dashboard actually puts the marker.
# 2. Even position-tolerant, a body with any trailing whitespace (which
#    `gh issue create --body-file` and browser-typed issues both leave)
#    could defeat a naive endsWith check -- the same GitHub-Actions-
#    expressions-have-no-escape-sequences bug found and fixed the same
#    day in mohammadlali0707-stack/Claud-Cloud-Project's own copy of this
#    workflow (`endsWith(body, '@agy\n')` matches literal backslash-n
#    text, never a real newline).
# 3. `target_repo=Mohammadlali/Claud-Cloud-Project` named the pre-
#    transfer owner/repo -- that repo now lives at
#    mohammadlali0707-stack/Claud-Cloud-Project; even a correctly
#    triggered run would have dispatched into a stale path.
# Fix: a `check-marker` job does a real bash, whitespace-tolerant check
# for "@agy" at EITHER end of the body; `agy-same-repo` accepts OWNER or
# COLLABORATOR (this repo's association for ACC0-authored issues was not
# independently confirmed from mohammadlali0707-stack -- accepting both
# is the same safe default used in Claud-Cloud-Project's own copy, not a
# new trust boundary); target_repo corrected.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  actions: write
  contents: read

jobs:
  check-marker:
    runs-on: ubuntu-latest
    if: always()
    outputs:
      match: ${{ steps.check.outputs.match }}
    steps:
      - name: Check for an @agy marker at either end, tolerant of whitespace
        id: check
        env:
          BODY: ${{ github.event.issue.body || github.event.comment.body || '' }}
        run: |
          TRIMMED="$(printf '%s' "$BODY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          case "$TRIMMED" in
            "@agy"*|*"@agy") echo "match=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "match=false" >> "$GITHUB_OUTPUT" ;;
          esac

  agy-same-repo:
    needs: [check-marker]
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'issues' && needs.check-marker.outputs.match == 'true' && (github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'issue_comment' && needs.check-marker.outputs.match == 'true' && github.event.comment.user.type != 'Bot' && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR'))
    steps:
      - name: Ack on the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "AGY is on it (same-repo listener, no relay)."

      - name: Build prompt
        id: prompt
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          sanitize() { sed "s/\`/'/g; s/\"/'/g; s/\$(/DOLLAR(/g; s/\${/DOLLAR{/g"; }
          SAFE_TITLE=$(printf '%s' "$ISSUE_TITLE" | sanitize)
          SAFE_BODY=$(printf '%s' "$ISSUE_BODY" | sanitize)
          SAFE_COMMENT=$(printf '%s' "$COMMENT_BODY" | sanitize)
          {
            printf '%s\n' 'You are AGY, an AI worker running inside this agw-workers repo itself.'
            printf 'TASK - Issue #%s: %s\n' "$ISSUE_NUM" "$SAFE_TITLE"
            printf '%s\n' "$SAFE_BODY"
            if [ -n "$SAFE_COMMENT" ]; then
              printf '%s\n' 'LATEST COMMENT:'
              printf '%s\n' "$SAFE_COMMENT"
            fi
          } > /tmp/prompt.txt
          echo "prompt_file=/tmp/prompt.txt" >> "$GITHUB_OUTPUT"

      - name: Dispatch agw-worker.yml in this same repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROMPT=$(cat /tmp/prompt.txt)
          gh workflow run agw-worker.yml \
            --repo "${{ github.repository }}" \
            --field "prompt=$PROMPT" \
            --field "target_repo=mohammadlali0707-stack/Claud-Cloud-Project" \
            --field "target_branch=claude/gateway-auth-fix-nr7k0b" \
            --field "acc_index=0" \
            --field "callback_id=same-repo-${{ github.event.issue.number }}-${{ github.run_id }}"
