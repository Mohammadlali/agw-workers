name: Refresh Vercel Secret
on: [workflow_dispatch]
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      ACC0_PAT: ${{ secrets.ACC0_PAT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_NEW }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_NEW }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_NEW }}
    steps:
      - name: Update Vercel Env Var via API
        run: |
          set -e
          echo "Fetching env vars..."
          ENV_ID=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" \
            | jq -r '.envs[] | select(.key == "AGY_CHAT_ACC0_PAT") | .id' || echo "")
          
          if [ -n "$ENV_ID" ]; then
            echo "Deleting existing env var $ENV_ID..."
            curl -sS -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$ENV_ID?teamId=$VERCEL_ORG_ID"
          fi
          
          echo "Adding new env var..."
          curl -sS -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            -d "{\"key\":\"AGY_CHAT_ACC0_PAT\",\"value\":\"$ACC0_PAT\",\"type\":\"secret\",\"target\":[\"production\",\"preview\",\"development\"]}" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID"
          echo "Done."