name: Verify fleet facts (read-only)

# Measures the claims this session could not check from outside Actions,
# because the repos involved belong to other accounts and a session reaches
# one owner at a time. Inside Actions the ACC*_PAT secrets exist, so the
# answers can simply be read rather than asked for.
#
# It was written to settle three claims that had contradictory answers, and
# it now serves as the standing check that they stay settled. What the first
# runs found, on 2026-09-17:
#
#   1. The hub does have a main branch and it is the default -- so the report
#      claiming HTTP 422 and no main was wrong. But main is not where the work
#      is. It was cut from the working branch at 01:09 and has not moved since,
#      while the working branch has carried on. Pointing an account at main
#      therefore checks out hub code that is missing commits, silently.
#
#   2. vars.TBS_BRANCH names the branch of the HUB that tbs-worker.yml checks
#      out -- not the branch of the agw-workers repo it is stored on. Eight
#      accounts named the working branch; ACC0 alone had been switched to main
#      and had been running two commits behind since 01:09. It is back in line.
#
#   3. The hub's own Cloud/workflows/tbs-worker.yml does carry the ACC6 owner
#      path and the ACC6_PAT fallback, on both branches. That fix was real,
#      even though the report announcing it quoted this repo's line numbers.
#
# expected_branch is an input rather than a constant so that renaming or
# merging the hub's working branch means re-running this with a new value,
# not editing the file and hoping someone notices.
#
# Read-only: every call is a GET. Nothing is created, changed or deleted.

on:
  workflow_dispatch:
    inputs:
      expected_branch:
        description: "The hub branch every account's TBS_BRANCH should name. Default is CCP's working branch; change it if the fleet moves, rather than editing this file."
        required: false
        default: 'claude/gateway-auth-fix-nr7k0b'
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      ACC0_PAT: ${{ secrets.ACC0_PAT }}
      ACC1_PAT: ${{ secrets.ACC1_PAT }}
      ACC2_PAT: ${{ secrets.ACC2_PAT }}
      ACC3_PAT: ${{ secrets.ACC3_PAT }}
      ACC4_PAT: ${{ secrets.ACC4_PAT }}
      ACC5_PAT: ${{ secrets.ACC5_PAT }}
      ACC6_PAT: ${{ secrets.ACC6_PAT }}
      ACC7_PAT: ${{ secrets.ACC7_PAT }}
      ACC8_PAT: ${{ secrets.ACC8_PAT }}
      HUB: mohammadlali0707-stack/Claud-Cloud-Project
      EXPECTED_BRANCH: ${{ inputs.expected_branch }}
    steps:
      - name: Read the facts
        shell: bash
        run: |
          set -uo pipefail
          for t in ACC0_PAT ACC6_PAT; do
            v="${!t:-}"
            if [ -z "$v" ]; then echo "::error::secrets.$t is not set on this repo"; exit 1; fi
            echo "::add-mask::$v"
          done

          API=https://api.github.com
          OUT=/tmp/report.md
          : > "$OUT"

          # $1 token, $2 path, $3 output file -> prints HTTP code
          get() {
            curl -sS -o "$3" -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer $1" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API/$2" || echo "000"
          }

          echo "## 1. Hub repository: \`$HUB\`" >> "$OUT"
          echo "" >> "$OUT"
          CODE=$(get "$ACC6_PAT" "repos/$HUB" /tmp/hub.json)
          if [ "$CODE" != "200" ]; then
            echo "- repo lookup returned **HTTP $CODE** -- cannot read it with ACC6_PAT" >> "$OUT"
            DEFAULT_BRANCH=""
          else
            DEFAULT_BRANCH=$(jq -r '.default_branch // "?"' /tmp/hub.json)
            PRIV=$(jq -r 'if .private then "private" else "public" end' /tmp/hub.json)
            echo "- default branch: **\`$DEFAULT_BRANCH\`**" >> "$OUT"
            echo "- visibility: $PRIV" >> "$OUT"

            BCODE=$(get "$ACC6_PAT" "repos/$HUB/branches?per_page=100" /tmp/branches.json)
            if [ "$BCODE" = "200" ]; then
              HAS_MAIN=$(jq -r '[.[].name] | index("main") | if . == null then "NO" else "YES" end' /tmp/branches.json)
              NAMES=$(jq -r '[.[].name] | join(", ")' /tmp/branches.json)
              echo "- a branch named \`main\` exists: **$HAS_MAIN**" >> "$OUT"
              echo "- all branches: $NAMES" >> "$OUT"
            else
              echo "- branch list returned HTTP $BCODE" >> "$OUT"
            fi
          fi
          echo "" >> "$OUT"

          # TBS_BRANCH is not the branch of the agw-workers repo it lives on.
          # It is the ref tbs-worker.yml checks the HUB out at:
          #   repository: mohammadlali0707-stack/Claud-Cloud-Project
          #   ref: ${{ vars.TBS_BRANCH }}
          # So the right value is whatever branch CCP's real work is on, which
          # the owner says is claude/gateway-auth-fix-nr7k0b, not main. main
          # was created from that branch this morning and has not moved since.
          #
          # Reading two accounts was not enough: the first run checked ACC0 and
          # ACC6, found them disagreeing, and the full sweep then showed ACC0
          # was the only one out of step.
          EXPECTED="${EXPECTED_BRANCH:-claude/gateway-auth-fix-nr7k0b}"
          echo "## 2. vars.TBS_BRANCH across all nine accounts" >> "$OUT"
          echo "" >> "$OUT"
          echo "Expected value: \`$EXPECTED\` (the hub branch to check out)." >> "$OUT"
          echo "" >> "$OUT"
          echo "| acc | repo | HTTP | value |" >> "$OUT"
          echo "|---|---|---|---|" >> "$OUT"
          MAIN_COUNT=0
          OTHER_COUNT=0
          for N in 0 1 2 3 4 5 6 7 8; do
            case "$N" in
              0) OWNER="Mohammadlali" ;;
              1) OWNER="momonakikugava-pixel" ;;
              2) OWNER="lali94m-max" ;;
              3) OWNER="ngocgminh5-debug" ;;
              4) OWNER="hmmletssee7-design" ;;
              5) OWNER="kidding602" ;;
              6) OWNER="mohammadlali0707-stack" ;;
              7) OWNER="mohammad97okk" ;;
              8) OWNER="moradzahra85-png" ;;
            esac
            PATVAR="ACC${N}_PAT"
            TOKEN="${!PATVAR:-}"
            if [ -z "$TOKEN" ]; then
              echo "| ACC$N | \`$OWNER/agw-workers\` | - | ACC${N}_PAT not set here |" >> "$OUT"
              continue
            fi
            echo "::add-mask::$TOKEN"
            VCODE=$(get "$TOKEN" "repos/$OWNER/agw-workers/actions/variables/TBS_BRANCH" /tmp/var.json)
            if [ "$VCODE" = "200" ]; then
              VAL=$(jq -r '.value // "?"' /tmp/var.json)
              if [ "$VAL" = "$EXPECTED" ]; then
                MAIN_COUNT=$((MAIN_COUNT + 1))
                echo "| ACC$N | \`$OWNER/agw-workers\` | 200 | \`$VAL\` |" >> "$OUT"
              else
                OTHER_COUNT=$((OTHER_COUNT + 1))
                echo "| ACC$N | \`$OWNER/agw-workers\` | 200 | **\`$VAL\`** <- differs from expected |" >> "$OUT"
              fi
            elif [ "$VCODE" = "404" ]; then
              echo "| ACC$N | \`$OWNER/agw-workers\` | 404 | not set (tbs-worker checks out an empty ref) |" >> "$OUT"
            else
              echo "| ACC$N | \`$OWNER/agw-workers\` | $VCODE | unreadable -- that PAT lacks admin |" >> "$OUT"
            fi
          done
          echo "" >> "$OUT"
          echo "matching \`$EXPECTED\`: $MAIN_COUNT &nbsp;&nbsp; differing: $OTHER_COUNT" >> "$OUT"
          echo "" >> "$OUT"

          echo "## 3. The hub's own tbs-worker.yml" >> "$OUT"
          echo "" >> "$OUT"
          echo "Looking for the ACC6 owner path and the ACC6_PAT token fallback." >> "$OUT"
          echo "" >> "$OUT"
          echo "| branch | path | HTTP | ACC6 repo path | ACC6_PAT fallback |" >> "$OUT"
          echo "|---|---|---|---|---|" >> "$OUT"

          REFS="$DEFAULT_BRANCH claude/gateway-auth-fix-nr7k0b main"
          PATHS="Cloud/workflows/tbs-worker.yml .github/workflows/tbs-worker.yml"
          SEEN=""
          for REF in $REFS; do
            if [ -z "$REF" ]; then continue; fi
            case " $SEEN " in *" $REF "*) continue ;; esac
            SEEN="$SEEN $REF"
            for P in $PATHS; do
              FCODE=$(get "$ACC6_PAT" "repos/$HUB/contents/$P?ref=$REF" /tmp/file.json)
              if [ "$FCODE" != "200" ]; then
                echo "| \`$REF\` | \`$P\` | $FCODE | - | - |" >> "$OUT"
                continue
              fi
              jq -r '.content // ""' /tmp/file.json | tr -d '\n' | base64 -d > /tmp/file.txt 2>/dev/null || : > /tmp/file.txt
              if grep -q "mohammadlali0707-stack/Claud-Cloud-Project" /tmp/file.txt; then OWNER_OK="YES"; else OWNER_OK="no"; fi
              if grep -q "TBS_HUB_TOKEN || secrets.ACC6_PAT" /tmp/file.txt; then TOK_OK="YES"; else TOK_OK="no"; fi
              echo "| \`$REF\` | \`$P\` | 200 | **$OWNER_OK** | **$TOK_OK** |" >> "$OUT"
            done
          done

          # The owner says claude/gateway-auth-fix-nr7k0b is CCP's real working
          # branch, not main. main was created earlier today from that branch's
          # SHA, so if work continued on the branch afterwards, main is a frozen
          # snapshot and any account pointing at it checks out stale hub code.
          # This measures the gap rather than assuming either way.
          echo "## 4. main vs the auth-fix branch" >> "$OUT"
          echo "" >> "$OUT"
          echo "| branch | head SHA | last commit |" >> "$OUT"
          echo "|---|---|---|" >> "$OUT"
          for B in main claude/gateway-auth-fix-nr7k0b; do
            HCODE=$(get "$ACC6_PAT" "repos/$HUB/branches/$B" /tmp/br.json)
            if [ "$HCODE" = "200" ]; then
              SHA=$(jq -r '.commit.sha // "?" | .[0:8]' /tmp/br.json)
              WHEN=$(jq -r '.commit.commit.committer.date // "?"' /tmp/br.json)
              echo "| \`$B\` | \`$SHA\` | $WHEN |" >> "$OUT"
            else
              echo "| \`$B\` | HTTP $HCODE | - |" >> "$OUT"
            fi
          done
          echo "" >> "$OUT"

          CCODE=$(get "$ACC6_PAT" "repos/$HUB/compare/main...claude/gateway-auth-fix-nr7k0b" /tmp/cmp.json)
          if [ "$CCODE" = "200" ]; then
            AHEAD=$(jq -r '.ahead_by // 0' /tmp/cmp.json)
            BEHIND=$(jq -r '.behind_by // 0' /tmp/cmp.json)
            STATUS=$(jq -r '.status // "?"' /tmp/cmp.json)
            echo "Comparing \`main\` to \`claude/gateway-auth-fix-nr7k0b\`: status **$STATUS**," >> "$OUT"
            echo "the auth-fix branch is **$AHEAD commit(s) ahead** of main and $BEHIND behind." >> "$OUT"
            echo "" >> "$OUT"
            if [ "$AHEAD" != "0" ]; then
              echo "> main is missing $AHEAD commit(s) that the working branch has." >> "$OUT"
              echo "> Any account whose TBS_BRANCH is \`main\` checks out hub code without them." >> "$OUT"
            else
              echo "> The two are level: pointing at either checks out the same hub code today." >> "$OUT"
            fi
          else
            echo "Branch comparison returned HTTP $CCODE." >> "$OUT"
          fi
          echo "" >> "$OUT"

          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"
          echo "--- report ---"
          cat "$OUT"
