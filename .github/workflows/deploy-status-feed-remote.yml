name: Refresh Status Dashboard Data (remote, runs here instead of on status-dashboard)

# Moved here 2026-09-12 at the owner's request: status-dashboard being
# public or private should not affect whether its 5-minute auto-update
# keeps working. This repo (agw-workers) is public with unlimited Actions
# minutes on every account, so running the refresh HERE instead of on
# status-dashboard itself decouples the update pipeline from that repo's
# own Actions-minutes quota entirely.
#
# Simplified again 2026-09-12, same day: the original version of this
# workflow still committed status.json back into status-dashboard and ran
# a full `vercel deploy` every 5 minutes -- 288 real Vercel deployments a
# day, which blew straight through Vercel's own free-tier cap of 100
# deployments/day (`deploy-status-feed.yml`'s run history shows the exact
# failure: "Error: Resource is limited ... api-deployments-free-per-day").
# status.json no longer lives in git or Vercel deploys at all; this
# workflow only regenerates the feed and publishes it. Actual site deploys
# (code changes) go through status-dashboard's own deploy-status-feed.yml,
# triggered by pushes to that repo, not by this 5-minute cron.
#
# Switched from Cloudflare R2 to a GitHub Gist the same day: R2 is
# permanently unavailable on the owner's Cloudflare account (not fully
# provisioned, so Cloudflare blocks all TLS to the R2 endpoint
# account-wide -- confirmed identically across 4 separate client/runtime
# combinations while debugging status-dashboard's api/status.js). The
# script now PATCHes the fleet's status Gist using ACC0_PAT (already
# present here, already has the 'gist' scope) instead -- no new secret
# needed on this repo.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      subdomain:
        description: 'Target subdomain on airboxvip.top'
        required: false
        default: 'status.airboxvip.top'
        type: string

permissions:
  contents: read

jobs:
  refresh-feed:
    name: Regenerate status.json and publish it to the status gist (from agw-workers)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACC0_PAT: ${{ secrets.ACC0_PAT }}
    steps:
      - name: Clone status-dashboard
        run: |
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ACC0_PAT" | base64 -w0)"
          git -c http.https://github.com/.extraHeader="$AUTH_HEADER" \
            clone --branch main --single-branch --depth 1 \
            "https://github.com/Mohammadlali/status-dashboard.git" /tmp/status-dashboard

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pywebpush 2>/dev/null || true

      - name: Regenerate status feed and publish to the status gist
        env:
          ACC1_PAT: ${{ secrets.ACC1_PAT }}
          ACC6_PAT: ${{ secrets.ACC6_PAT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          SUBDOMAIN="${{ inputs.subdomain || 'status.airboxvip.top' }}"
          cd /tmp/status-dashboard
          python3 Tools/collect_status_feed.py --out /tmp/status.json --subdomain "$SUBDOMAIN"
