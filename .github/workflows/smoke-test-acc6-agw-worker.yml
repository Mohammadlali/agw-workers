name: One-off - smoke test ACC6's reconciled agw-worker.yml

# Confirms the file pushed by the (now-deleted) fix-acc6-agw-worker.yml
# actually runs on GitHub Actions, not just that it parses as YAML.
# Dispatches it with no target_repo (checkout/push/Reports-write all skip
# cleanly on an empty target_repo, by that file's own design) so this is a
# pure smoke test of the identity-selection + agy-run + artifact-fallback
# path, without touching any real ACC6 repo. Delete after it has run once.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch agw-worker.yml on mohammadlali0707-stack/agw-workers
        env:
          ACC6_PAT: ${{ secrets.ACC6_PAT }}
        run: |
          set -e
          CODE=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $ACC6_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/mohammadlali0707-stack/agw-workers/actions/workflows/agw-worker.yml/dispatches" \
            -d '{"ref":"main","inputs":{"prompt":"Reply with exactly one line: smoke test ok.","callback_id":"smoke-reconcile-test"}}')
          echo "dispatch HTTP $CODE"
          cat /tmp/resp.txt
          if [ "$CODE" != "204" ]; then
            echo "::error::dispatch failed"
            exit 1
          fi
