name: Read ACC6 workflow run history (read-only)

# Issue #25 on ACC6 proved agy-plan-bot FIRES: it posted "Project Manager: در
# حال آماده‌سازی پروپوزال..." two minutes after the issue was created. What it
# did not prove is that the chain FINISHES -- ten minutes later that ack was
# still the only comment on the issue, and no proposal had arrived.
#
# An ack is not an output. Three things could produce that shape:
#
#   1. agy-plan-bot fired, acked, then failed at a later step (most likely
#      where it calls the model).
#   2. The job is still sitting in ACC6's self-hosted queue, the way three
#      jobs queued at once and drained serially on this account today.
#   3. The ack and the proposal live in different jobs or workflows, and the
#      second was never dispatched.
#
# Comments on the issue cannot tell these apart -- all three look identical
# from outside, which is why the first two reads of this said "healthy". The
# run history can: it shows the conclusion of every run, and, for the newest
# one, the conclusion of every STEP, which names the line that failed.
#
# Read-only: GETs against the Actions API.

on:
  workflow_dispatch:
    inputs:
      workflows:
        description: 'Space-separated workflow filenames on ACC6 to report on'
        required: false
        default: 'agy-plan-bot.yml agy-plan-dispatch.yml agy-lead-plan.yml'
        type: string
      runs:
        description: 'How many recent runs to list per workflow'
        required: false
        default: '5'
        type: string
      logs_run_id:
        description: 'Optional: dump the logs of every failed job in this ACC6 run id'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  read:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      ACC6_PAT: ${{ secrets.ACC6_PAT }}
      SRC: mohammadlali0707-stack/agw-workers
      WFS_INPUT: ${{ inputs.workflows }}
      RUNS_INPUT: ${{ inputs.runs }}
      LOGS_RUN_INPUT: ${{ inputs.logs_run_id }}
    steps:
      - name: Report run history
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${ACC6_PAT:-}" ]; then echo "::error::secrets.ACC6_PAT is not set"; exit 1; fi
          echo "::add-mask::$ACC6_PAT"

          WFS="${WFS_INPUT:-}"
          [ -z "$WFS" ] && WFS="agy-plan-bot.yml agy-plan-dispatch.yml agy-lead-plan.yml"
          N="${RUNS_INPUT:-5}"
          case "$N" in ''|*[!0-9]*) N=5 ;; esac

          API=https://api.github.com
          OUT=/tmp/out.md
          : > "$OUT"
          echo "Source: \`$SRC\` -- newest $N runs per workflow." >> "$OUT"
          echo "" >> "$OUT"

          for WF in $WFS; do
            echo "## \`$WF\`" >> "$OUT"
            echo "" >> "$OUT"

            CODE=$(curl -sS -o /tmp/r.json -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer $ACC6_PAT" \
              -H "Accept: application/vnd.github+json" \
              "$API/repos/$SRC/actions/workflows/$WF/runs?per_page=$N" || echo "000")

            if [ "$CODE" != "200" ]; then
              echo "No run history (HTTP $CODE) -- the workflow may not exist on ACC6." >> "$OUT"
              echo "" >> "$OUT"
              continue
            fi

            TOTAL=$(jq -r '.total_count // 0' /tmp/r.json)
            if [ "$TOTAL" = "0" ]; then
              # A workflow that exists but has never run is itself the answer
              # for case 3: nothing ever dispatched it.
              echo "**Never run.** The workflow exists but has no runs at all." >> "$OUT"
              echo "" >> "$OUT"
              continue
            fi

            echo "$TOTAL run(s) total. Newest first:" >> "$OUT"
            echo "" >> "$OUT"
            echo "| created | event | status | conclusion | run |" >> "$OUT"
            echo "|---|---|---|---|---|" >> "$OUT"
            jq -r '.workflow_runs[] | "| \(.created_at) | \(.event) | \(.status) | **\(.conclusion // "-- still running --")** | [\(.id)](\(.html_url)) |"' \
              /tmp/r.json >> "$OUT"
            echo "" >> "$OUT"

            RID=$(jq -r '.workflow_runs[0].id // ""' /tmp/r.json)
            [ -z "$RID" ] && continue

            JCODE=$(curl -sS -o /tmp/j.json -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer $ACC6_PAT" \
              -H "Accept: application/vnd.github+json" \
              "$API/repos/$SRC/actions/runs/$RID/jobs?per_page=20" || echo "000")

            echo "**Steps of the newest run ($RID)** -- this names the line that failed:" >> "$OUT"
            echo "" >> "$OUT"
            if [ "$JCODE" != "200" ]; then
              echo "Job list returned HTTP $JCODE." >> "$OUT"
            else
              echo '```' >> "$OUT"
              jq -r '.jobs[] | "job: \(.name)  [\(.status)/\(.conclusion // "-")]  runner=\(.runner_name // "none -- never picked up")",
                       (.steps[]? | "     \(.number). \(.name)  ->  \(.status)/\(.conclusion // "-")")' \
                /tmp/j.json >> "$OUT"
              echo '```' >> "$OUT"
            fi
            echo "" >> "$OUT"
          done

          # Knowing WHICH step failed narrows the cause; the step's own output
          # names it. "Install AGY CLI from HF Dataset" can fail because the
          # runner has no egress to huggingface.co, because the HF token is
          # missing or expired, or because a tool the installer needs is not
          # on the box -- three different fixes, indistinguishable from the
          # step list alone.
          if [ -n "${LOGS_RUN_INPUT:-}" ]; then
            RID="$LOGS_RUN_INPUT"
            echo "## Logs of failed jobs in run \`$RID\`" >> "$OUT"
            echo "" >> "$OUT"

            JCODE=$(curl -sS -o /tmp/lj.json -w '%{http_code}' --max-time 30 \
              -H "Authorization: Bearer $ACC6_PAT" \
              -H "Accept: application/vnd.github+json" \
              "$API/repos/$SRC/actions/runs/$RID/jobs?per_page=20" || echo "000")

            if [ "$JCODE" != "200" ]; then
              echo "Job list returned HTTP $JCODE." >> "$OUT"
            else
              FAILED_IDS=$(jq -r '.jobs[] | select(.conclusion == "failure") | .id' /tmp/lj.json)
              if [ -z "$FAILED_IDS" ]; then
                echo "No job in this run concluded \`failure\`." >> "$OUT"
              fi
              for JID in $FAILED_IDS; do
                JNAME=$(jq -r --arg i "$JID" '.jobs[] | select((.id|tostring) == $i) | .name' /tmp/lj.json)
                echo "### job \`$JNAME\` (id $JID) -- last 80 lines" >> "$OUT"
                echo "" >> "$OUT"
                # curl drops the Authorization header when the API redirects to
                # the log blob on another host, so the PAT is not sent there.
                LCODE=$(curl -sSL -o /tmp/log.txt -w '%{http_code}' --max-time 60 \
                  -H "Authorization: Bearer $ACC6_PAT" \
                  -H "Accept: application/vnd.github+json" \
                  "$API/repos/$SRC/actions/jobs/$JID/logs" || echo "000")
                echo '```' >> "$OUT"
                if [ "$LCODE" != "200" ]; then
                  echo "(log download returned HTTP $LCODE)" >> "$OUT"
                else
                  tail -80 /tmp/log.txt >> "$OUT"
                fi
                echo '```' >> "$OUT"
                echo "" >> "$OUT"
              done
            fi
          fi

          cat "$OUT" >> "$GITHUB_STEP_SUMMARY"
          echo "--- report ---"
          cat "$OUT"
