name: One-off - create the status-data Gist

# R2 is permanently unavailable on this Cloudflare account (owner confirmed:
# not fully provisioned due to billing, so Cloudflare blocks ALL TLS
# connections to the R2 endpoint account-wide -- not fixable in code, seen
# identically across 4 different client/runtime combinations). Replacing
# it with a secret Gist on ACC0, holding two files (status.json,
# subscription.json) -- reuses a credential and an API (GitHub's) already
# proven reliable everywhere else in this project, no new Vercel storage
# product to provision. Run this once; record the resulting gist id in
# Team/CHANGELOG.md and wire it into refresh-status-data.yml /
# deploy-status-feed-remote.yml / api/status.js / api/subscribe.js.

on:
  workflow_dispatch: {}

jobs:
  create-gist:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ secrets.ACC0_PAT }}
    steps:
      - name: Create the gist
        run: |
          set -e
          PAYLOAD=$(jq -n '{description: "claud-cloud fleet status data (status.json + push subscription) -- machine-updated, not for manual editing", public: false, files: {"status.json": {content: "{\"placeholder\": true}"}, "subscription.json": {content: "{\"placeholder\": true}"}}}')
          CODE=$(curl -s -o /tmp/gist_resp.json -w "%{http_code}" \
            -X POST "https://api.github.com/gists" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$PAYLOAD")
          echo "HTTP $CODE"
          cat /tmp/gist_resp.json
          if [ "$CODE" != "201" ]; then
            echo "::error::Gist creation failed -- check that secrets.ACC0 has the 'gist' scope."
            exit 1
          fi
          GIST_ID=$(jq -r '.id' /tmp/gist_resp.json)
          STATUS_RAW=$(jq -r '.files["status.json"].raw_url' /tmp/gist_resp.json)
          SUB_RAW=$(jq -r '.files["subscription.json"].raw_url' /tmp/gist_resp.json)
          {
            echo "### Gist created"
            echo "- gist_id: \`$GIST_ID\`"
            echo "- status.json raw_url: $STATUS_RAW"
            echo "- subscription.json raw_url: $SUB_RAW"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "GIST_ID=$GIST_ID"
